# Perfil usado pelos testes automatizados: banco H2 em memória e chave falsa.
# Nenhum teste deste perfil chama a OpenAI: as portas de IA são substituídas por dublês.
spring.docker.compose.enabled=false
spring.datasource.url=jdbc:h2:mem:budgeting;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.ai.openai.api-key=${OPENAI_API_KEY:test-key}
logging.level.org.springframework.ai=INFO
