name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build e testes (sem chamar a OpenAI)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: Resumo dos erros
        if: failure()
        run: |
          grep -E "error:|FAILED|Exception|What went wrong|Caused by" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
